  <main class="main-container">
    <div class="page-title-bar">
      <div>
        <h1>Funcionários</h1>
        <p>Consulte o resumo dos funcionários e seus setores.</p>
      </div>
    </div>

    <section class="content-card">
      <div class="card-header">
        <h2>Funcionários</h2>
        <div class="card-header-actions">
          <button class="btn-primary" type="button" onclick="openModal('modal-equipe')">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="var(--white)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-plus-icon lucide-plus">
              <path d="M5 12h14" />
              <path d="M12 5v14" />
            </svg>
            Novo Funcionário</button>
        </div>
      </div>
      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th>Funcionário</th>
              <th>Cargo</th>
              <th>Setor</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tabelaEquipe"></tbody>
        </table>
      </div>
    </section>

    <div id="modal-equipe" class="modal-overlay">
      <div class="modal-card">
        <div class="modal-header">
          <h2>Adicionar Novo Membro</h2>
          <button class="modal-close" onclick="closeModal('modal-equipe')">&times;</button>
        </div>
        <form id="form-nova-equipe" onsubmit="salvarMembro(event)">
          <div class="form-group">
            <label>Nome Completo</label>
            <input name="nome" type="text" required pattern="[A-Za-zÀ-ÿ ]+" title="Digite apenas letras e espaços" placeholder="Ex: Ana Souza">
          </div>
          <div class="form-group">
            <label>Telefone:</label>
            <input name="telefone" type="tel" required inputmode="numeric" maxlength="15" pattern="\(\d{2}\) (\d{5}|\d{4})-\d{4}" placeholder="Ex: (11) 12345-1234">
          </div>
          <div class="form-group">
            <label>E-mail Corporativo</label>
            <input name="email" type="email" required placeholder="ana@helpti.com">
          </div>
          <div class="form-group">
            <label for="setor-membro">Setor</label>
            <input id="setor-membro" name="setor" type="text" required maxlength="120" placeholder="Ex: Suporte">
          </div>
          <div class="modal-footer">
            <button type="button" class="button button--secondary"
              onclick="closeModal('modal-equipe')">Cancelar</button>
            <button type="submit" class="button button--primary">Cadastrar membro</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="../assets/js/main.js"></script>
