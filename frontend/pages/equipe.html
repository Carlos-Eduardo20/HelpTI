<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../assets/images/cpu.png" type="imagem de icon">
    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <title>HelpTI</title>
</head>
<body>

    <header class="top-navbar">
    <div class="nav-container">
      <div class="brand-group">
        <a href="dashboard.html" class="navbar-brand">
          <img src="../assets/images/Frame.png" alt="HelpTI Logo" class="brand-logo">
          <span class="brand-name">HelpTI</span>
        </a>
        <nav class="nav-tabs">
          <a href="dashboard.html" class="tab-item">Dashboard</a>
          <a href="chamados.html" class="tab-item">Chamados</a>
          <a href="clientes.html" class="tab-item">Clientes</a>
          <a href="equipe.html" class="tab-item active">Equipe</a>
          <a href="relatorios.html" class="tab-item">Relatórios</a>
        </nav>
      </div>

      <div class="user-profile-wrapper" onclick="toggleProfileMenu(event)">
        <div class="user-profile">
          <span class="user-role">• Funcionário</span>
          <div class="user-avatar">
            <img src="https://ui-avatars.com/api/?name=Usuario+HelpTI&background=E5E7EB&color=374151" alt="Avatar">
          </div>
        </div>
        <div class="profile-dropdown" id="profileDropdown">
          <a href="configuracoes.html" class="dropdown-item">⚙️ Configurações</a>
          <a href="../index.html" class="dropdown-item danger">🚪 Sair</a>
        </div>
      </div>
    </div>
  </header>

  <main class="main-container">
    <div class="page-title-bar">
      <div>
        <h1>Técnicos & Operadores</h1>
        <p>Controle de equipe interna e permissões de acesso.</p>
      </div>
      <button class="btn-primary" onclick="alert('Convidar Técnico')">+ Novo Técnico</button>
    </div>

    <section class="content-card">
      <div class="card-header">
        <h2>Membros da Equipe</h2>
      </div>
      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Função</th>
              <th>Chamados Alocados</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><strong>Carlos Eduardo</strong></td>
              <td>Técnico Nível 2</td>
              <td>3 chamados ativos</td>
              <td><span style="background: var(--status-info-bg); color: var(--status-info-text); padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600;">Em Atendimento</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="../assets/js/dashboard.js"></script>

</body>
</html>
