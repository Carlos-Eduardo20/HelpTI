<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../assets/images/cpu.png" type="imagem de icon">
    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/account.css">
    <title>HelpTI</title>
</head>
<body>

    <main>
        <div class="create-account-grid">
            <div class="create-account-content">
                <h2>Solicitar conta para sua empresa</h2>
                <p>Preencha o formulário abaixo para solicitar uma conta corporativa na plataforma HelpTI.</p>

                <form id="accountForm" autocomplete="off" onsubmit="solicitarConta(event)">
                    <div class="input-group">
                        <label for="companyName">Nome da Empresa</label>
                        <input 
                            type="text" 
                            id="companyName" 
                            placeholder="Digite o nome da sua empresa" 
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="email">E-mail Corporativo</label>
                        <input 
                            type="email" 
                            id="email" 
                            placeholder="Digite o e-mail corporativo" 
                            required
                        >
                    </div>

                </form>
            </div>
        </div>
    </main>
    
</body>
</html>
