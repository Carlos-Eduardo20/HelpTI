<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../assets/images/cpu.png" type="imagem de icon">
    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/account.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <title>HelpTI</title>
</head>
<body class="auth-page">

    <div class="auth-container">
        <div class="auth-wrapper">
            
            <!-- Cabeçalho / Header -->
            <div class="auth-header">
                <div class="auth-icon-badge">
                    <i data-lucide="building-2"></i>
                </div>
                <h1>Solicitar conta para sua empresa</h1>
                <p>Registre uma conta corporativa para acessar a plataforma HelpTi</p>
            </div>

            <!-- Card de Formulário -->
            <div class="auth-card">
                <form id="formRegister">
                    
                    <!-- Campo: Empresa -->
                    <div class="form-group">
                        <label for="empresa">Empresa</label>
                        <div class="input-icon-wrapper">
                            <i data-lucide="building-2" class="input-icon"></i>
                            <input 
                                type="text" 
                                id="empresa" 
                                name="empresa" 
                                placeholder="Nome da sua empresa" 
                                required
                            >
                        </div>
                    </div>

                    <!-- Campo: E-mail Corporativo -->
                    <div class="form-group">
                        <label for="email">E-mail corporativo</label>
                        <div class="input-icon-wrapper">
                            <i data-lucide="mail" class="input-icon"></i>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="voce@suaempresa.com.br"
                                autocomplete="email"
                                required
                            >
                        </div>
                        <span class="field-hint">
                            Somente e-mails empresariais. E-mails gratuitos (Gmail, Hotmail, Outlook etc.) não são aceitos.
                        </span>
                    </div>

                    <!-- Campo: Senha -->
                    <div class="form-group">
                        <label for="senha">Senha</label>
                        <div class="input-icon-wrapper">
                            <i data-lucide="lock" class="input-icon"></i>
                            <input
                                type="password"
                                id="senha"
                                name="senha"
                                placeholder="Mínimo de 8 caracteres"
                                minlength="8"
                                autocomplete="new-password"
                                required
                            >
                        </div>
                    </div>

                    <!-- Campo: Confirmar Senha -->
                    <div class="form-group">
                        <label for="confirmarSenha">Confirmar senha</label>
                        <div class="input-icon-wrapper">
                            <i data-lucide="lock" class="input-icon"></i>
                            <input
                                type="password"
                                id="confirmarSenha"
                                name="confirmarSenha"
                                placeholder="Repita sua senha"
                                minlength="8"
                                autocomplete="new-password"
                                required
                            >
                        </div>
                    </div>

                    <!-- Botão de Ação -->
                    <p class="form-message" id="registerFeedback" role="status" aria-live="polite"></p>
                    <button type="submit" class="btn-primary-auth">Criar conta empresarial</button>
                </form>
            </div>

            <!-- Rodapé / Footer -->
            <div class="auth-footer">
                Já tem uma conta? <a href="login.html">Entrar</a>
            </div>

        </div>
    </div>

    <script src="../assets/js/register.js"></script>

</body>
</html>
