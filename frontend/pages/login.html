<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('helpti-theme') === 'dark' ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <link rel="shortcut icon" href="../assets/images/cpu.png" type="imagem de icon">
    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/login.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <title>HelpTI</title>
</head>
<body>

    <!-- Tela geral de fundo -->
  <div class="page-wrapper">
    
    <!-- O Card Único que junta Imagem + Formulário (login-card no Figma) -->
    <main class="login-card">
      
      <!-- Lado Esquerdo: Imagem PNG colada -->
      <section class="brand-panel">
        <img src="../assets/images/brand-panel.png" alt="HelpTI Banner" class="brand-img">
      </section>

      <!-- Lado Direito: Formulário de Login -->
      <section class="form-panel">
        
        <header class="form-header">
          <h2>Entrar na plataforma</h2>
          <p>Insira suas credenciais para gerenciar seus chamados</p>
        </header>

        <form id="loginForm" autocomplete="off" onsubmit="realizarLogin(event)">
          
          <div class="input-group">
            <label for="email">E-mail</label>
            <input 
              type="email" 
              id="email" 
              placeholder="suporte@suaempresa.com.br" 
              autocomplete="off"
              required
            >
          </div>

          <div class="input-group">
            <div class="label-row">
              <label for="password">Senha de acesso</label>
              <a href="forgot-password.html" class="forgot-link">Esqueceu a senha?</a>
            </div>
            <input 
              type="password" 
              id="password" 
              placeholder="••••••••" 
              autocomplete="new-password"
              required
            >
          </div>

          <div class="checkbox-group">
            <input type="checkbox" id="remember">
            <label for="remember">Manter-me conectado por 30 dias</label>
          </div>

          <button type="submit" class="btn-login">Entrar</button>

          <div class="login-divider" aria-hidden="true"><span>ou</span></div>
          <a class="btn-microsoft-login" href="/auth/microsoft">
            <span class="microsoft-logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            Entrar com Microsoft
          </a>
          <p class="login-feedback" id="loginFeedback" role="status" aria-live="polite"></p>
        
        </form>

        <footer class="form-footer">
          <p>Novo por aqui? <a href="account.html">Criar conta</a></p>
        </footer>

      </section>

    </main>

  </div>

  <script type="module">
    import { comCarregamento, mostrarErro } from '../assets/js/notifications.js';
    const DURACAO_LOGIN_DIAS = 30;
    let verificacaoSessaoLembrada;

    function limparSessaoLembrada() {
      localStorage.removeItem('perfilNome');
      localStorage.removeItem('grupoId');
      localStorage.removeItem('empresaNome');
      localStorage.removeItem('loginExpiraEm');
      localStorage.removeItem('emailLembrado');
    }

    // Garante que nenhum overlay/loader fique preso na tela se algum script falhar.
    function removerOverlays() {
      document.querySelectorAll('.modal-overlay, .agenda-calendar-overlay, .loading-overlay, .loader, .backdrop')
        .forEach((el) => {
          el.classList.remove('active', 'show', 'open');
          el.hidden = true;
          el.style.display = 'none';
        });
    }
    window.addEventListener('error', removerOverlays);
    window.addEventListener('unhandledrejection', removerOverlays);

    function limparEstadoBotao() {
      const formulario = document.getElementById('loginForm');
      const botao = formulario?.querySelector('button[type="submit"]');
      if (!botao) return;
      botao.disabled = false;
      botao.textContent = 'Entrar';
    }

    function limparSessaoExpirada() {
      const expiraEm = Number(localStorage.getItem('loginExpiraEm') || 0);
      if (localStorage.getItem('grupoId') && (!expiraEm || expiraEm <= Date.now())) {
        limparSessaoLembrada();
      }
    }

    async function abrirSessaoLembrada() {
      const expiraEm = Number(localStorage.getItem('loginExpiraEm') || 0);
      if (!localStorage.getItem('grupoId') || expiraEm <= Date.now()) return false;

      verificacaoSessaoLembrada ||= fetch(`${window.location.origin}/api/sessao`, {
        credentials: 'same-origin',
        cache: 'no-store'
      }).then((response) => response.ok).catch(() => false);

      if (await verificacaoSessaoLembrada) {
        window.location.replace('dashboard.html');
        return true;
      }
      limparSessaoLembrada();
      return false;
    }

    function limparCamposLogin() {
      const email = document.getElementById('email');
      const senha = document.getElementById('password');
      const lembrar = document.getElementById('remember');
      if (email) email.value = '';
      if (senha) senha.value = '';
      if (lembrar) lembrar.checked = false;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (await continuarLoginMicrosoft()) return;
      limparSessaoExpirada();
      if (await abrirSessaoLembrada()) return;
      limparEstadoBotao();
      limparCamposLogin();
      const errosMicrosoft = {
        microsoft_nao_configurado: 'O acesso Microsoft ainda não foi configurado pelo administrador.',
        microsoft_cancelado: 'A autenticação Microsoft foi cancelada ou não autorizada.',
        microsoft_identidade_invalida: 'A Microsoft não retornou um endereço de e-mail válido.',
        microsoft_sem_conta: 'Crie e confirme primeiro sua conta HelpTI com o mesmo e-mail.',
        microsoft_conta_vinculada: 'Esta conta já está vinculada a outra identidade Microsoft.',
        conta_inativa: 'Esta conta está inativa.'
      };
      const codigoErro = new URLSearchParams(window.location.search).get('erro');
      if (errosMicrosoft[codigoErro]) {
        document.getElementById('loginFeedback').textContent = errosMicrosoft[codigoErro];
      }
    });
    window.addEventListener('pageshow', async (event) => {
      if (event.persisted) verificacaoSessaoLembrada = undefined;
      if (await abrirSessaoLembrada()) return;
      limparEstadoBotao();
      limparCamposLogin();
    });

    async function continuarLoginMicrosoft() {
      if (new URLSearchParams(window.location.search).get('microsoft') !== 'ok') return false;
      const feedback = document.getElementById('loginFeedback');
      try {
        const response = await fetch(`${window.location.origin}/api/sessao`, {
          credentials: 'same-origin',
          cache: 'no-store'
        });
        if (!response.ok) throw new Error('Não foi possível confirmar a sessão Microsoft.');
        const dados = (await response.json()) ?? {};
        sessionStorage.setItem('grupoId', String(dados.id ?? ''));
        sessionStorage.setItem('perfilNome', dados.nome || '');
        sessionStorage.setItem('empresaNome', dados.empresaNome || 'HelpTI');
        window.location.replace('dashboard.html');
      } catch (error) {
        if (feedback) feedback.textContent = error.message;
      }
      return true;
    }

    window.realizarLogin = async function realizarLogin(event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('password').value;
      const lembrar = document.getElementById('remember').checked;
      const botao = event.target.querySelector('button[type="submit"]');

      await comCarregamento(botao, async () => {
      try {
        const response = await fetch(`${window.location.origin}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha, lembrar })
        });
        const dados = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(dados.erro || 'Não foi possível entrar.');

        sessionStorage.removeItem('perfilNome');
        sessionStorage.removeItem('grupoId');
        localStorage.removeItem('perfilNome');
        localStorage.removeItem('grupoId');
        localStorage.removeItem('empresaNome');
        localStorage.removeItem('loginExpiraEm');
        if (lembrar) {
          localStorage.setItem('perfilNome', dados.nome);
          localStorage.setItem('grupoId', dados.id);
          localStorage.setItem('empresaNome', dados.empresaNome || 'HelpTI');
          localStorage.setItem('loginExpiraEm', String(Date.now() + DURACAO_LOGIN_DIAS * 24 * 60 * 60 * 1000));
          localStorage.setItem('emailLembrado', email);
        } else {
          sessionStorage.setItem('perfilNome', dados.nome);
          sessionStorage.setItem('grupoId', dados.id);
          sessionStorage.setItem('empresaNome', dados.empresaNome || 'HelpTI');
          localStorage.removeItem('emailLembrado');
        }
        window.location.href = 'dashboard.html';
      } catch (error) {
        mostrarErro(error.message);
      }
      }, 'Verificando...');
    };
  </script>

</body>
</html>
