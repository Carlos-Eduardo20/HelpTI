<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script>document.documentElement.dataset.theme = localStorage.getItem('helpti-theme') === 'dark' ? 'dark' : 'light';</script>
        <!-- CSS -->
        <link rel="stylesheet" href="../assets/css/forgot-password.css">
        <link rel="stylesheet" href="../assets/css/responsive.css">
        <!-- Lucide Icons para os ícones de e-mail e seta -->
        <script src="https://unpkg.com/lucide@latest"></script>
        <title>HelpTI</title>
    </head>
    <body class="auth-body">
        <div class="auth-container">   
            <div class="auth-wrapper">
                <!-- Cabeçalho / Header -->
                <div class="auth-header">
                    <div class="auth-icon-badge">
                        <i data-lucide="mail"></i>
                    </div>
                    <h1>Recuperar senha</h1>
                    <p>Enviaremos um código de confirmação para o email cadastrado na conta.</p>
                </div>

                <!-- Card de Formulário -->
                <div class="auth-card">
                    <form id="formForgotPassword">
                        <div class="form-group">
                            <label for="email">Email da conta</label>
                            <div class="input-icon-wrapper">
                                <i data-lucide="mail" class="input-icon"></i>
                                <input type="email" id="email" name="email" placeholder="voce@empresa.com" autocomplete="email" required>
                            </div>
                        </div>
                        <p class="form-message" id="forgotFeedback" role="status" aria-live="polite"></p>
                        <button type="submit" class="btn-primary-auth">Enviar código</button>
                    </form>
                    <form id="formResetPassword" hidden>
                        <div class="form-group">
                            <label for="recoveryCode">Código de seis dígitos</label>
                            <div class="input-icon-wrapper">
                                <i data-lucide="key-round" class="input-icon"></i>
                                <input type="text" id="recoveryCode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="newPassword">Nova senha</label>
                            <div class="input-icon-wrapper">
                                <i data-lucide="lock" class="input-icon"></i>
                                <input type="password" id="newPassword" minlength="8" autocomplete="new-password" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="confirmPassword">Confirme a nova senha</label>
                            <div class="input-icon-wrapper">
                                <i data-lucide="lock" class="input-icon"></i>
                                <input type="password" id="confirmPassword" minlength="8" autocomplete="new-password" required>
                            </div>
                        </div>
                        <p class="form-message" id="resetFeedback" role="status" aria-live="polite"></p>
                        <button type="submit" class="btn-primary-auth">Redefinir senha</button>
                    </form>
                </div>
                <!-- Rodapé / Footer -->
                <div class="auth-footer-link">
                    <a href="login.html">
                        <i data-lucide="arrow-left"></i> Voltar para log in
                    </a>
                </div>
            </div>
        </div>
        <script src="../assets/js/forgot-password.js"></script>
    </body>
</html>
