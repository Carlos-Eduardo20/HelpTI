<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- CSS -->
        <link rel="stylesheet" href="../assets/css/forgot-password.css">
        <!-- Lucide Icons para os ícones de e-mail e seta -->
        <script src="https://unpkg.com/lucide@latest"></script>
        <title>HelpTI</title>
    </head>
    <body class="auth-body">
        <div class="auth-container">   
            <div class="auth-wrapper">
                <!-- Cabeçalho / Header -->
                <div class="auth-header">
                    <div class="auth-icon-badge">
                        <i data-lucide="mail"></i>
                    </div>
                    <h1>Resetar Senha</h1>
                    <p>Nós vamos enviar um link para redefinir sua senha.</p>
                </div>

                <!-- Card de Formulário -->
                <div class="auth-card">
                    <form id="formForgotPassword">
                        <!-- Campo: Email Address -->
                        <div class="form-group">
                            <label for="email">Seu Email</label>
                            <div class="input-icon-wrapper">
                                <i data-lucide="mail" class="input-icon"></i>
                                <input type="email" id="email" name="email" placeholder="you@example.com" required>
                            </div>
                        </div>
                        <!-- Botão de Ação -->
                        <button type="submit" class="btn-primary-auth">Enviar link</button>
                    </form>
                </div>
                <!-- Rodapé / Footer -->
                <div class="auth-footer-link">
                    <a href="login.html">
                        <i data-lucide="arrow-left"></i> Voltar para log in
                    </a>
                </div>
            </div>
        </div>
        <script src="../assets/js/forgot-password.js"></script>
    </body>
</html>
