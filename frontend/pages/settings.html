<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../assets/images/cpu.png" type="imagem de icon">
    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/settings.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <title>HelpTI</title>
</head>
<body>

    <!-- Conteúdo Principal -->
  <main class="main-container">

    <!-- Cabeçalho da Página -->
    <div class="page-title-bar settings-title">
      <div>
        <span class="section-tag">CENTRAL DE SUPORTE</span>
        <h1>Configurações</h1>
        <p>Gerencie as preferências básicas do seu workspace.</p>
      </div>
    </div>

    <!-- Card de Dados da Empresa -->
    <section class="content-card settings-card">
      <h2>Dados da empresa</h2>

      <div class="settings-profile-photo">
        <div class="user-avatar profile-photo-avatar">
          <img src="../assets/images/cpu.png" alt="Foto do perfil">
          <button type="button" class="profile-photo-edit" aria-label="Alterar foto do perfil" title="Alterar foto do perfil">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>
          </button>
          <input class="profile-photo-input" type="file" accept="image/jpeg,image/png,image/webp" aria-label="Escolher foto do perfil">
        </div>
      </div>
    </section>


  </main>

  <script type="module" src="../assets/js/main.js"></script>

</body>
</html>
