services:
  - type: web
    name: help-ti
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DB_SQLITE_PATH
        value: /var/data/helpti.sqlite3
      - key: HELPTI_DEMO_MODE
        value: "true"
      - key: HELPTI_HTTPS_ONLY
        value: "true"
    disk:
      name: help-ti-data
      mountPath: /var/data
      sizeGB: 1
