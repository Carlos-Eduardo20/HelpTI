services:
  help-ti:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${HELPTI_BIND_ADDRESS:-127.0.0.1}:${HELPTI_PORT:-5000}:5000"
    environment:
      HELPTI_HOST: "0.0.0.0"
      HELPTI_DEBUG: "false"
      HELPTI_DB_PATH: "/app/instance/helpti.sqlite3"
      HELPTI_DEMO_MODE: "${HELPTI_DEMO_MODE:-true}"
      HELPTI_HTTPS_ONLY: "${HELPTI_HTTPS_ONLY:-false}"
    volumes:
      - help-ti-data:/app/instance
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  help-ti-data:
